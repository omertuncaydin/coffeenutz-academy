<style>
  :root{
    --bg:#f7f2ec; --card:#ffffff; --ink:#2b1d14; --muted:#8a7263;
    --brand:#6f4e37; --accent:#e07b39; --ok:#2e7d32; --warn:#c62828; --line:#e7dcd2;
    --chip:#f0e6dc;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink)}
  button{font:inherit; cursor:pointer}
  .hidden{display:none!important}

  /* Login */
  #login{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px}
  .loginCard{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px; width:100%; max-width:380px; box-shadow:0 6px 24px rgba(43,29,20,.08)}
  .loginCard h1{font-size:20px; margin:0 0 4px} .loginCard p{color:var(--muted); margin:0 0 18px; font-size:14px}
  .loginCard input{width:100%; padding:13px 14px; margin-bottom:10px; border:1px solid var(--line); border-radius:10px; font-size:15px}
  .btn{display:inline-block; background:var(--brand); color:#fff; border:none; border-radius:10px; padding:13px 18px; font-size:15px; font-weight:600}
  .btn.full{width:100%} .btn.ghost{background:var(--chip); color:var(--ink)} .btn.small{padding:8px 12px; font-size:13px; border-radius:8px}
  .btn.accent{background:var(--accent)}

  /* Shell */
  header{position:sticky; top:0; z-index:10; background:var(--brand); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px}
  header .logo{font-weight:700; font-size:15px} header .sp{flex:1}
  header .who{font-size:12px; opacity:.85}
  nav{position:sticky; top:48px; z-index:9; display:flex; background:var(--card); border-bottom:1px solid var(--line)}
  nav button{flex:1; border:none; background:none; padding:12px 4px; font-size:13px; font-weight:600; color:var(--muted); border-bottom:3px solid transparent}
  nav button.on{color:var(--brand); border-bottom-color:var(--accent)}
  main{padding:14px; max-width:900px; margin:0 auto}

  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px}
  .tile{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px}
  .tile .n{font-size:26px; font-weight:800} .tile .l{font-size:12px; color:var(--muted)}
  .tile.bad .n{color:var(--warn)} .tile.good .n{color:var(--ok)}

  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px}
  .card h3{margin:0 0 2px; font-size:16px}
  .row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .chip{background:var(--chip); border-radius:999px; padding:3px 10px; font-size:12px; font-weight:600}
  .chip.warn{background:#fde3e3; color:var(--warn)} .chip.ok{background:#e2f2e3; color:var(--ok)} .chip.acc{background:#fdeadb; color:#a2551b}
  .meta{font-size:12px; color:var(--muted)}
  .pre{white-space:pre-wrap; font-size:13px; background:var(--bg); border-radius:10px; padding:10px; margin:8px 0 0}
  .sec{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:16px 0 8px; font-weight:700}

  label.f{display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; font-weight:600}
  select,input[type=date],input[type=text],textarea{width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:#fff}
  textarea{min-height:70px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}

  .bar{height:8px; background:var(--chip); border-radius:99px; overflow:hidden; margin:8px 0 4px}
  .bar i{display:block; height:100%; background:var(--accent)}

  #toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:99px; font-size:14px; opacity:0; transition:.25s; pointer-events:none; z-index:99}
  #toast.show{opacity:1}
  .search{width:100%; padding:12px; border:1px solid var(--line); border-radius:12px; font-size:15px; margin-bottom:10px}
  .filters{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:8px}
  .filters button{white-space:nowrap; border:1px solid var(--line); background:var(--card); border-radius:99px; padding:7px 12px; font-size:13px; font-weight:600; color:var(--muted)}
  .filters button.on{background:var(--brand); color:#fff; border-color:var(--brand)}
  .foot{display:flex; gap:8px; margin-top:10px}

  /* v3: modal + durum geçmişi */
  #modalWrap{position:fixed; inset:0; background:rgba(43,29,20,.45); z-index:60; display:flex; align-items:flex-end; justify-content:center}
  #modalWrap .modal{background:var(--card); border-radius:16px 16px 0 0; padding:18px 18px 24px; width:100%; max-width:520px; max-height:85vh; overflow:auto}
  @media(min-width:640px){ #modalWrap{align-items:center; padding:20px} #modalWrap .modal{border-radius:16px} }
  .tagrow{display:flex; gap:6px; flex-wrap:wrap}
  .tile.click{cursor:pointer; user-select:none} .tile.click:active{transform:scale(.98)}
  .chipbtn{border:none; cursor:pointer}
</style>

  try{ localStorage.setItem("cn_lang", LANG); }catch(_){}
  applyChrome();
  if (LEADS && TRAIN) renderAll();

  document.getElementById("btnLogout").textContent = t("cikis");

// ---------- auth ----------
async function doLogin(){
  const { data, error } = await sb.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("pass").value,
  });
  if (error){ document.getElementById("loginMsg").textContent = "Giriş başarısız: " + error.message; return; }
  session = data.session; enter();
}
async function doLogout(){ await sb.auth.signOut(); location.reload(); }
async function boot(){
  const { data } = await sb.auth.getSession();
  if (data.session){ session = data.session; enter(); }
}
async function enter(){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("who").textContent = session.user.email;
  await refreshAll();
}

// ---------- proxy ----------
async function api(payload){
  const r = await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/smartsheet-proxy`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + session.access_token,
      "apikey": CONFIG.SUPABASE_ANON_KEY,
    },
    body: JSON.stringify(payload),
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || j.message || ("HTTP " + r.status));
  return j;
}

async function refreshAll(){
  toast(t("yukleniyor"));
  try{
    const [ld, td] = await Promise.all([
      api({ action:"getSheet", sheetId: CONFIG.SHEET_LEADS }),
      api({ action:"getSheet", sheetId: CONFIG.SHEET_TRAININGS }),
    ]);
    if (!ld.columns || !td.columns) throw new Error("Beklenmeyen yanıt: " + JSON.stringify(ld).slice(0,200));
    LEADS = ld; TRAIN = td;
    LC = {}; ld.columns.forEach(c => LC[c.title] = c.id);
    TC = {}; td.columns.forEach(c => TC[c.title] = c.id);
    renderAll(); toast(t("guncellendi"));
    loadOffers(); // own data source, own error card: never blocks the sheets
  }catch(e){
    const msg = esc(String(e && e.message ? e.message : e));
    ["panel","bugun","pipeline","siniflar"].forEach(v => {
      document.getElementById("v-"+v).innerHTML =
        `<div class="card"><h3>${t("baglantiHatasi")}</h3>
         <p class="meta">${t("veriCekilemedi")}</p>
         <div class="pre">${msg}</div>
         <p class="meta">${t("hataYardim")}</p>
         <div class="foot"><button class="btn" onclick="refreshAll()">${t("tekrarDene")}</button></div></div>`;
    });
    toast(t("hataVeri"));
  }
}

// ---------- helpers ----------
function cell(row, colId){ const c = (row.cells||[]).find(x => x.columnId === colId); return c ? (c.displayValue ?? c.value ?? "") : ""; }
function rawCell(row, colId){ const c = (row.cells||[]).find(x => x.columnId === colId); return c ? (c.value ?? null) : null; }
function today(){ return new Date().toISOString().slice(0,10); }
function fmtTL(n){ return isFinite(n) ? new Intl.NumberFormat("tr-TR").format(n) + " ₺" : "-"; }
function esc(s){ return String(s??"").replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function toast(m){ const el = document.getElementById("toast"); el.textContent = m; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"), 1800); }
function show(v){
  ["panel","bugun","pipeline","siniflar","teklifler"].forEach(x => {
    document.getElementById("v-"+x).classList.toggle("hidden", x!==v);
    document.getElementById("tab-"+x).classList.toggle("on", x===v);
  });
}
function gotoPipe(mode){
  if (mode === "won"){ pipeMode = null; durumFilter = "Kayıt Oldu"; }
  else { pipeMode = mode; durumFilter = "Hepsi"; }
  renderPipeline(); show("pipeline");
}
function wonWhere(r){
  const name = cell(r, LC["Ad Soyad"]);
  if (!name) return "none";
  let up = false, past = false;
  (TRAIN.rows||[]).forEach(row2 => {
    const n = cell(row2, TC["Notes"]);
    if (!n || !n.includes(name)) return;
    if (cell(row2, TC["End date"]) >= today()) up = true; else past = true;
  });
  return up ? "upcoming" : (past ? "past" : "none");
}
function gotoSiniflarDolu(){ sinifDolu = true; renderSiniflar(); show("siniflar"); }
const OPEN_DURUM = ["Yeni Talep","Bilgi Verildi","Düşünüyor","Takipte"];
function leadRows(){ return (LEADS.rows||[]).filter(r => cell(r, LC["Ad Soyad"])); }
function isOverdue(r){
  const d = cell(r, LC["Sonraki Adım Tarihi*"] ?? LC["Sonraki Adım Tarihi"]);
  return d && d < today() && OPEN_DURUM.includes(cell(r, LC["Durum"]));
}
function isDateless(r){
  const d = cell(r, LC["Sonraki Adım Tarihi*"] ?? LC["Sonraki Adım Tarihi"]);
  const du = cell(r, LC["Durum"]);

async function saveLead(rowId){
  const r = leadRows().find(x => x.id === rowId);
  const dateCol = LC["Sonraki Adım Tarihi*"] ?? LC["Sonraki Adım Tarihi"];
  const cells = [], changed = [], histLines = [];
  const nd = document.getElementById("pd-"+rowId).value;
  if (nd !== cell(r, LC["Durum"])){ cells.push({ columnId: LC["Durum"], value: nd }); histLines.push(`[${today()}] ${nd}`); changed.push(t("durumLbl")); }
  const nt = document.getElementById("pt-"+rowId).value;
  if (nt !== cell(r, dateCol)){ cells.push({ columnId: dateCol, value: nt || "" }); changed.push(t("sonrakiTarih")); }
  const ng = document.getElementById("pg-"+rowId).value.trim();
  if (ng !== cell(r, LC["GSM"])){ cells.push({ columnId: LC["GSM"], value: ng }); changed.push("GSM"); }
  const ne = document.getElementById("pe-"+rowId).value.trim();
  if (ne !== cell(r, LC["Eposta"])){ cells.push({ columnId: LC["Eposta"], value: ne }); changed.push("Eposta"); }
  const nk = document.getElementById("pk-"+rowId).value;
  if (nk){ cells.push({ columnId: LC["Kaynak*"] ?? LC["Kaynak"], objectValue: { objectType: "MULTI_PICKLIST", values: [nk] }, strict: false }); changed.push("Kaynak"); }
  document.querySelectorAll(".plCourse-"+rowId).forEach(cb => {
    const cur = rawCell(r, LC[cb.value]) === true;
    if (cb.checked !== cur){
      cells.push({ columnId: LC[cb.value], value: cb.checked });
      histLines.push(`[${today()}] ${(cb.checked ? "+" : "-")}${cb.value}`);
      changed.push((cb.checked ? "+" : "-") + cb.value);
    }
  });
  const note = document.getElementById("pn-"+rowId).value.trim();
  if (note){
    const old = cell(r, LC["Notlar"]);
    cells.push({ columnId: LC["Notlar"], value: `[${today()}] ${note}` + (old ? "\n\n" + old : "") });
    changed.push("Notlar");
  }
  if (histLines.length && LC[HIST_TITLE]){
    const oldH = cell(r, LC[HIST_TITLE]);
    cells.push({ columnId: LC[HIST_TITLE], value: histLines.join("\n") + (oldH ? "\n" + oldH : "") });
  }
  if (!cells.length){ toast(t("degisiklikYok")); return; }
  const wasKayit = cell(r, LC["Durum"]) === "Kayıt Oldu" && nd !== "Kayıt Oldu";
  try{
    await api({ action:"updateRows", sheetId: CONFIG.SHEET_LEADS, rows:[{ id: rowId, cells }] });
  }catch(e){ toast(t("hata") + ": " + e.message); return; }
  await refreshAll(); show("pipeline");
  toast(wasKayit ? t("koltukUyari") : t("guncellendi") + ": " + changed.join(", "));
}

// ---------- v3: durum geçmişi + modal + tek-dokunuş kayıt ----------
const HIST_TITLE = "Durum Geçmişi";
function histCells(r, newDurum){
  const hc = LC[HIST_TITLE];
  if (!hc) return []; // column missing: degrade gracefully, never block the save
  const line = `[${today()}] ${newDurum}`;
  const old = cell(r, hc);
  if (old.split("\n")[0] === line) return []; // same-day duplicate guard
  return [{ columnId: hc, value: line + (old ? "\n" + old : "") }];
}
function histTags(r){
  const hc = LC[HIST_TITLE];
  const raw = hc ? cell(r, hc) : "";
  if (!raw) return "";
  const chips = raw.split("\n").map(l => {
    const m = l.match(/^\[(\d{4})-(\d{2})-(\d{2})\]\s*(.+)$/);
    if (!m) return "";
    const p4 = m[4];
    const cls = (p4.startsWith("+") || p4.startsWith("-")) ? "" : (p4==="Kayıt Oldu" ? "ok" : ((p4==="Kaybedildi"||p4==="Kapsam Dışı") ? "warn" : "acc"));
    return `<span class="chip ${cls}">${esc(p4)} · ${m[3]}.${m[2]}.${m[1].slice(2)}</span>`;
  }).filter(Boolean).join("");
  return chips ? `<div class="sec">${t("durumGecmisi")}</div><div class="tagrow">${chips}</div>` : "";
}

async function doYeniDurum(rowId){
  const r = leadRows().find(x => x.id === rowId);
  const dateCol = LC["Sonraki Adım Tarihi*"] ?? LC["Sonraki Adım Tarihi"];
  const nd = document.getElementById("md-"+rowId).value;
  const ndate = document.getElementById("mt-"+rowId).value;
  const cells = [];
  if (nd !== cell(r, LC["Durum"])){ cells.push({ columnId: LC["Durum"], value: nd }); cells.push(...histCells(r, nd)); }
  if (ndate !== cell(r, dateCol)) cells.push({ columnId: dateCol, value: ndate || "" });
  if (!cells.length){ closeModal(); toast(t("degisiklikYok")); return; }
  const wasKayit = cell(r, LC["Durum"]) === "Kayıt Oldu" && nd !== "Kayıt Oldu";
  await api({ action:"updateRows", sheetId: CONFIG.SHEET_LEADS, rows:[{ id: rowId, cells }] });
  closeModal();
  await refreshAll(); show("pipeline");
  if (wasKayit) toast(t("koltukUyari"));
}

// ---------- v3.3: yeni lead ----------
function openYeniLead(){
  const cboxes = COURSE_LIST.map(k => `<label style="display:flex; align-items:center; gap:6px; font-size:13px; margin:2px 0"><input type="checkbox" class="nlCourse" value="${k}" style="width:auto">${k}</label>`).join("");
  const kOpts = [`<option value="">${t("secilmedi")}</option>`].concat(KAYNAK_OPTS.map(k=>`<option>${esc(k)}</option>`)).join("");
  openModal(`
    <h3>${t("yeniLeadTitle")}</h3>
    <label class="f">${t("adSoyadLbl")}</label><input type="text" id="nlName">
    <div class="grid2">
      <div><label class="f">GSM *</label><input type="text" id="nlGsm" inputmode="tel"></div>
      <div><label class="f">Eposta</label><input type="text" id="nlMail" inputmode="email"></div>
      <div><label class="f">${t("kaynakLbl")} *</label><select id="nlKaynak">${kOpts}</select></div>
      <div><label class="f">${t("durumLbl")}</label>${durumSelect("nlDurum","Yeni Talep")}</div>
    </div>
    <label class="f">${t("sonrakiTarih")}</label><input type="date" id="nlDate" value="${today()}">
    <label class="f">${t("ilgilendigi")} *</label>
    <div class="grid2" style="gap:2px">${cboxes}</div>
    <label class="f">${t("ilkNot")}</label><textarea id="nlNote"></textarea>
    <div class="foot">
      <button class="btn accent" id="nlGo" onclick="doYeniLead()">${t("ekle")}</button>
      <button class="btn ghost" onclick="closeModal()">${t("vazgec")}</button>
    </div>`);
}
async function doYeniLead(){
  const name = document.getElementById("nlName").value.trim();
  const gsm = document.getElementById("nlGsm").value.trim();
  const mail = document.getElementById("nlMail").value.trim();
  const kay = document.getElementById("nlKaynak").value;
  const nCourses = document.querySelectorAll(".nlCourse:checked").length;
  const missing = [];
  if (!name) missing.push("Ad Soyad");
  if (!gsm) missing.push("GSM");
  if (!kay) missing.push("Kaynak");
  if (!nCourses) missing.push(t("ilgilendigi"));
  if (missing.length){ toast(t("eksik") + missing.join(", ")); return; }
  document.getElementById("nlGo").disabled = true;
  const cells = [
    { columnId: LC["Ad Soyad"], value: name },
    { columnId: LC["Talep Tarihi"], value: today() },
    { columnId: LC["GSM"], value: gsm },
  ];
  if (mail) cells.push({ columnId: LC["Eposta"], value: mail });
  cells.push({ columnId: LC["Kaynak*"] ?? LC["Kaynak"], objectValue: { objectType: "MULTI_PICKLIST", values: [kay] }, strict: false });
  const du = document.getElementById("nlDurum").value;
  cells.push({ columnId: LC["Durum"], value: du });
  if (LC[HIST_TITLE]) cells.push({ columnId: LC[HIST_TITLE], value: `[${today()}] ${du}` });
  const nd = document.getElementById("nlDate").value;
  if (nd) cells.push({ columnId: LC["Sonraki Adım Tarihi*"] ?? LC["Sonraki Adım Tarihi"], value: nd });
  document.querySelectorAll(".nlCourse:checked").forEach(cb => { if (LC[cb.value]) cells.push({ columnId: LC[cb.value], value: true }); });
  const note = document.getElementById("nlNote").value.trim();
  if (note) cells.push({ columnId: LC["Notlar"], value: `[${today()}] ${note}` });
  try{
    await api({ action:"addRow", sheetId: CONFIG.SHEET_LEADS, row: { cells } });
  }catch(e){ toast("Hata: " + e.message); document.getElementById("nlGo").disabled = false; return; }
  closeModal();
  await refreshAll(); show("pipeline");
  toast(t("eklendi"));
}

// ---------- Sınıflar ----------
function renderSiniflar(){
  const TIPS = ["Hepsi","Roasting","Barista","Sensory","Q Grader"];
  const DILS = [["Hepsi","Hepsi"],["TR","Turkish"],["EN","English"]];
  let rows = (TRAIN.rows||[]).filter(r => cell(r, TC["Training"]) && cell(r, TC["Training"]) !== "TOTAL");
  if (sinifTip !== "Hepsi") rows = rows.filter(r => cell(r, TC["Training"]).toLowerCase().includes(sinifTip.toLowerCase()));
  if (sinifDil !== "Hepsi") rows = rows.filter(r => cell(r, TC["Lang."]) === sinifDil);
  if (sinifDolu) rows = rows.filter(r => (Number(rawCell(r, TC["Regstrd"]))||0) > 0);
  const upcoming = rows.filter(r => cell(r, TC["End date"]) >= today()).sort((a,b)=>cell(a,TC["Start date"]).localeCompare(cell(b,TC["Start date"])));
  const past = rows.filter(r => cell(r, TC["End date"]) < today()).sort((a,b)=>cell(b,TC["Start date"]).localeCompare(cell(a,TC["Start date"])));
  document.getElementById("v-siniflar").innerHTML =
    (sinifDolu ? `<div class="row" style="margin-bottom:8px"><button class="chip warn chipbtn" onclick="sinifDolu=false; renderSiniflar()">${t("panelFiltre")}: ${t("doluSiniflar")} ✕</button></div>` : "") +
    `<div class="filters">${TIPS.map(x=>`<button class="${x===sinifTip?"on":""}" onclick="sinifTip='${x}'; renderSiniflar()">${x==="Hepsi" ? t("hepsi") : x}</button>`).join("")}</div>` +
    `<div class="filters">${DILS.map(([lbl,val])=>`<button class="${val===sinifDil?"on":""}" onclick="sinifDil='${val}'; renderSiniflar()">${lbl==="Hepsi" ? t("hepsi") : lbl}</button>`).join("")}</div>` +
    `<details class="secfold" open><summary class="sec" style="cursor:pointer">${t("yaklasanSiniflar")} (${upcoming.length})</summary>` +
      (upcoming.map(trainCard).join("") || `<div class="card"><p class="meta">${t("yaklasanYok")}</p></div>`) + `</details>` +
    `<details class="secfold"><summary class="sec" style="cursor:pointer">${t("gecmisKapali")} (${past.length})</summary>` +
      past.slice(0,12).map(trainCard).join("") + `</details>`;
}
function trainCard(r){
  const reg = Number(rawCell(r, TC["Regstrd"]))||0, cap = Number(rawCell(r, TC["Cap"]))||0;
  const pct = cap ? Math.min(100, Math.round(reg/cap*100)) : 0;
  const statuses = ["Registration open","Confirmed","In progress","Delivered","Cancelled"];
  const st = cell(r, TC["Status"]);
  return `<div class="card">
    <div class="row"><h3>${esc(cell(r, TC["Training"]))}</h3>
      <span class="chip">${esc(cell(r, TC["Lang."]))}</span>
      <span class="chip ${st==="Cancelled"?"warn":(st==="Delivered"?"ok":"acc")}">${esc(st)}</span></div>
    <p class="meta">${esc(cell(r, TC["Start date"]))} → ${esc(cell(r, TC["End date"]))} · ${fmtTL(Number(rawCell(r, TC["Price TRY"])))} ${t("perKoltuk")}</p>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <p class="meta">${reg}/${cap} ${t("koltukKisa")} · ${t("gerceklesen")}: ${fmtTL(Number(rawCell(r, TC["Realized Income"]))||reg*Number(rawCell(r, TC["Price TRY"])))}</p>
    <details><summary style="cursor:pointer; font-size:13px; color:var(--brand); font-weight:600">${t("duzenle")}</summary>
      <div class="grid2">
        <div><label class="f">${t("kayitliReg")}</label><input type="text" id="tr-${r.id}" value="${reg}" inputmode="numeric"></div>
        <div><label class="f">Status</label><select id="ts-${r.id}">${statuses.map(s=>`<option ${s===st?"selected":""}>${s}</option>`).join("")}</select></div>
      </div>
      <label class="f">${t("notesEkle")}</label><textarea id="tn-${r.id}" placeholder="${t("notesOrnek")}"></textarea>
      <div class="foot"><button class="btn" onclick="saveTrain(${r.id})">${t("kaydet")}</button></div>
    </details>
  </div>`;
}
async function saveTrain(rowId){
  const r = (TRAIN.rows||[]).find(x => x.id === rowId);
  const cells = [];
  const nr = Number(document.getElementById("tr-"+rowId).value);
  if (isFinite(nr) && nr !== (Number(rawCell(r, TC["Regstrd"]))||0)) cells.push({ columnId: TC["Regstrd"], value: nr });
  const ns = document.getElementById("ts-"+rowId).value;
  if (ns !== cell(r, TC["Status"])) cells.push({ columnId: TC["Status"], value: ns });
  const note = document.getElementById("tn-"+rowId).value.trim();
  if (note){
    const old = cell(r, TC["Notes"]);
    cells.push({ columnId: TC["Notes"], value: (old ? old + " " : "") + note });
  }
  if (!cells.length){ toast(t("degisiklikYok")); return; }
  try{
    await api({ action:"updateRows", sheetId: CONFIG.SHEET_TRAININGS, rows:[{ id: rowId, cells }] });
  }catch(e){ toast(t("hata") + ": " + e.message); return; }
  await refreshAll(); show("siniflar");
}

// ---------- v3.9: Öneriler (takvimden gelen tarih önerileri; kaynak: Supabase date_offers) ----------
let OFFERS = null, OFFERS_ERR = null;
async function offersApi(payload){
  const r = await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/date-offers-admin`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + session.access_token,
      "apikey": CONFIG.SUPABASE_ANON_KEY,
    },
    body: JSON.stringify(payload),
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || j.message || ("HTTP " + r.status));
  return j;
}
async function loadOffers(){
  try{
    const j = await offersApi({ action: "list" });
    OFFERS = j.offers || []; OFFERS_ERR = null;
  }catch(e){
    OFFERS = null; OFFERS_ERR = String(e && e.message ? e.message : e);
  }
  renderOffers();
}
function offersNewCount(){ return (OFFERS || []).filter(o => o.status === "new").length; }
function updateOffersTab(){
  const el = document.getElementById("tab-teklifler");
  if (!el) return;
  const n = offersNewCount();
  el.textContent = t("tabOneriler") + (n ? ` (${n})` : "");
}
function pad0(n){ return String(n).padStart(2, "0"); }
function fmtDT(s){
  if (!s) return "";
  const d = new Date(s);
  if (isNaN(d)) return String(s);
  return `${pad0(d.getDate())}.${pad0(d.getMonth() + 1)}.${d.getFullYear()} ${pad0(d.getHours())}:${pad0(d.getMinutes())}`;
}
function offerCard(o){
  const mail = String(o.contact || "").includes("@");
  const contact = mail
    ? `<a href="mailto:${esc(o.contact)}">${esc(o.contact)}</a>`
    : `<a href="tel:${esc(o.contact)}">${esc(o.contact)}</a>`;
  const st = o.status === "converted"
    ? `<span class="chip ok">${t("cevrildi")} ✓</span>`
    : (o.status === "handled" ? `<span class="chip">${t("ilgilenildi")}</span>` : `<span class="chip acc">${t("yeniOneri")}</span>`);
  return `<div class="card">
    <div class="row"><h3>${esc(o.name)}</h3>${st}<span class="chip">${esc(String(o.lang || "tr").toUpperCase())}</span>${o.wa_ping === "sent" ? `<span class="chip ok">WA ✓</span>` : ""}</div>
    <p class="meta"><b>${t("teklifEdilen")}: ${esc(o.offer_date)}</b> · ${esc(o.training)}</p>
    <p class="meta">${contact} · ${fmtDT(o.created_at)}</p>
    ${o.note ? `<div class="pre">${esc(o.note)}</div>` : ""}
    ${o.status === "converted" ? "" : `<div class="foot">
      <button class="btn small accent" onclick="openConvert('${o.id}')">${t("leadCevir")}</button>
      ${o.status === "new"
        ? `<button class="btn small ghost" onclick="setOfferStatus('${o.id}','handled')">${t("ilgilenildi")}</button>`
        : `<button class="btn small ghost" onclick="setOfferStatus('${o.id}','new')">${t("geriAl")}</button>`}
    </div>`}
  </div>`;
}
function renderOffers(){
  updateOffersTab();
  const el = document.getElementById("v-teklifler");
  if (!el) return;
  if (OFFERS_ERR){
    el.innerHTML = `<div class="card"><h3>${t("oneriHata")}</h3><div class="pre">${esc(OFFERS_ERR)}</div>
      <p class="meta">${t("oneriHataYardim")}</p>
      <div class="foot"><button class="btn" onclick="loadOffers()">${t("tekrarDene")}</button></div></div>`;
    return;
  }
  if (OFFERS === null){ el.innerHTML = `<div class="card"><p class="meta">${t("yukleniyor")}</p></div>`; return; }
  const open = OFFERS.filter(o => o.status === "new");
  const closed = OFFERS.filter(o => o.status !== "new");
  el.innerHTML = `
    <p class="meta" style="margin:2px 0 10px">${t("oneriAciklama")}</p>
    ${open.map(offerCard).join("") || `<div class="card"><p class="meta">${t("onerilerYok")}</p></div>`}
    ${closed.length ? `<details class="secfold"><summary class="sec" style="cursor:pointer">${t("kapaliOneriler")} (${closed.length})</summary>${closed.map(offerCard).join("")}</details>` : ""}`;
}
async function setOfferStatus(id, st){
  try{ await offersApi({ action: "setStatus", id, status: st }); }
  catch(e){ toast(t("hata") + ": " + e.message); return; }
  await loadOffers();
  toast(t("guncellendi"));
}
function openConvert(id){
  const o = (OFFERS || []).find(x => x.id === id);
  if (!o) return;
  openModal(`
    <h3>${t("leadCevir")}: ${esc(o.name)}</h3>
    <p class="meta">${esc(o.offer_date)} · ${esc(o.training)} · ${esc(o.contact)}</p>
    <p class="meta">${t("cevirAciklama")}</p>
    <div class="foot">
      <button class="btn accent" id="cvGo" onclick="doConvert('${o.id}')">${t("leadCevir")}</button>
      <button class="btn ghost" onclick="closeModal()">${t("vazgec")}</button>
    </div>`);
}
async function doConvert(id){
  document.getElementById("cvGo").disabled = true;
  try{ await offersApi({ action: "convert", id }); }
  catch(e){ toast(t("hata") + ": " + e.message); document.getElementById("cvGo").disabled = false; return; }
  closeModal();
  await refreshAll(); // pulls the new lead into the pipeline; loadOffers runs inside
  show("teklifler");
  toast(t("leadOlusturuldu"));
}

function renderAll(){ renderPanel(); renderBugun(); renderPipeline(); renderSiniflar(); renderOffers(); }
applyChrome();
boot();
</script>
